version: '3.8'

services:
  cad-converter:
    build:
      context: ./cad-converter
    container_name: arcos-cad-converter
    ports:
      - "8080:8080"
    networks:
      - arcos-network
    environment:
      - MAX_UPLOAD_SIZE_MB=200
      - CAD_CONVERSION_TIMEOUT=120
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  arcos-network:
    name: arcos-network
    driver: bridge
